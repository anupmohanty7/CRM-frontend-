<div class="crm-shell">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="brand">
      <div class="brand-mark">L</div>

      <div class="brand-text">
        <span class="brand-name">LeadHelp</span>
        <span class="brand-subtitle">CRM</span>
      </div>
    </div>

    <nav class="navigation">

      <div class="nav-section">
        <span class="section-label">MAIN</span>

        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          class="nav-item"
        >
          <span class="nav-icon">⌂</span>
          <span>Dashboard</span>
        </a>

        <a
          routerLink="/customers"
          routerLinkActive="active"
          class="nav-item"
        >
          <span class="nav-icon">♙</span>
          <span>Customers</span>
        </a>

        <a
          routerLink="/followups"
          routerLinkActive="active"
          class="nav-item"
        >
          <span class="nav-icon">◷</span>
          <span>Follow-ups</span>
        </a>

        <a
          routerLink="/notes"
          routerLinkActive="active"
          class="nav-item"
        >
          <span class="nav-icon">▤</span>
          <span>Notes</span>
        </a>
      </div>

      <div class="nav-section">
        <span class="section-label">MANAGEMENT</span>

        <a
          routerLink="/users"
          routerLinkActive="active"
          class="nav-item"
        >
          <span class="nav-icon">♧</span>
          <span>Users</span>
        </a>

        <a
          routerLink="/custom-fields"
          routerLinkActive="active"
          class="nav-item"
        >
          <span class="nav-icon">⚙</span>
          <span>Custom Fields</span>
        </a>
      </div>

    </nav>

    <div class="sidebar-bottom">

      <button class="logout-button" type="button" (click)="logout()">
        <span class="nav-icon">↪</span>
        <span>Logout</span>
      </button>

    </div>

  </aside>


  <!-- Main area -->
  <div class="main-area">

    <header class="topbar">

      <div class="topbar-left">
        <span class="topbar-label">LeadHelp CRM</span>
      </div>

      <div class="topbar-right">

        <button class="notification-button" type="button">
          <span>♧</span>
          <span class="notification-dot"></span>
        </button>

        <div class="user-profile">

          <div class="avatar">
            U
          </div>

          <div class="user-details">
            <span class="user-name">User</span>
            <span class="user-role">CRM User</span>
          </div>

        </div>

      </div>

    </header>


    <main class="page-content">

      <router-outlet></router-outlet>

    </main>

  </div>

</div>
